name: Native Windows prototype
on:
  push:
    branches: ['native/windows-prototype']
    paths: ['native-windows/**', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native-windows -B native-windows/build -A x64
      - name: Build
        run: cmake --build native-windows/build --config Release
      - name: Test
        run: ctest --test-dir native-windows/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: LiShen-Native-Windows-x64
          path: |
            native-windows/build/Release/LiShen.exe
            native-windows/README.md
